plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("com.android.library")
    id("org.jetbrains.kotlin.android")
    id("com.google.devtools.ksp")
    id("androidx.room")
    alias(libs.plugins.kotlinSerialization)
}

android {
  namespace = "com.skydoves.pokedex"

  defaultConfig {
    consumerProguardFile("proguard-rules.pro")
    // We don't export schemas, but Room's Gradle plugin doesn't know that. We use the project
    // directory as a placeholder.
    room {
      schemaDirectory("$projectDir")
    }
  }

  buildFeatures {
    dataBinding = true
    buildConfig = true
  }
}

dependencies {
    // AndroidX
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.fragment:fragment-ktx:1.8.4")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
    implementation("androidx.startup:startup-runtime:1.2.0")
    implementation("androidx.palette:palette-ktx:1.0.0")
    implementation("androidx.tracing:tracing:1.3.0-rc01")

    // Database
    // TODO: Update to Room 2.7.0 stable once released (b/407725691)
    implementation("androidx.room:room-runtime:2.7.0-rc03")
    implementation("androidx.room:room-ktx:2.7.0-rc03")
    ksp("androidx.room:room-compiler:2.7.0-rc03")

    // SkyDoves Libraries
    implementation("com.github.skydoves:bindables:1.1.0")
    implementation("com.github.skydoves:rainbow:1.0.4")
    implementation("com.github.skydoves:androidribbon:1.0.4")
